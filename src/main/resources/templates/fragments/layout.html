<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | Eventify'">Eventify</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #333; }
        header { background: #1a237e; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.4rem; letter-spacing: 1px; }
        nav a { color: #c5cae9; text-decoration: none; margin-right: 1.2rem; font-size: 0.95rem; }
        nav a:hover { color: #fff; text-decoration: underline; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        h2 { font-size: 1.3rem; color: #1a237e; margin-bottom: 1rem; border-left: 4px solid #3f51b5; padding-left: 0.6rem; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        th { background: #3f51b5; color: #fff; padding: 0.6rem 0.9rem; text-align: left; }
        td { padding: 0.55rem 0.9rem; border-bottom: 1px solid #e8eaf6; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f0f4ff; }
        .empty-msg { color: #888; font-style: italic; padding: 0.8rem 0; }
        .btn { display: inline-block; padding: 0.5rem 1.1rem; border-radius: 5px; font-size: 0.92rem; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #3f51b5; color: #fff; }
        .btn-primary:hover { background: #283593; }
        .btn-secondary { background: #e8eaf6; color: #3f51b5; }
        .btn-secondary:hover { background: #c5cae9; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.3rem; color: #444; }
        input[type=text], input[type=date], input[type=number], textarea {
            width: 100%; padding: 0.5rem 0.7rem; border: 1px solid #c5cae9;
            border-radius: 5px; font-size: 0.92rem; outline: none; }
        input:focus, textarea:focus { border-color: #3f51b5; box-shadow: 0 0 0 2px #c5cae9; }
        .actions { display: flex; gap: 0.8rem; margin-top: 0.5rem; }
        footer { text-align: center; font-size: 0.8rem; color: #aaa; padding: 1.5rem 0 2rem; }
    </style>
</head>

<header th:fragment="navbar">
    <h1>&#128197; Eventify</h1>
    <nav>
        <a th:href="@{/admin/}">Panel principal</a>
        <a th:href="@{/admin/eventos/nuevo}">Nuevo evento</a>
        <a th:href="@{/admin/lugares/nuevo}">Nuevo lugar</a>
        <a th:href="@{/swagger-ui/index.html}" target="_blank">API Docs</a>
    </nav>
</header>

<footer th:fragment="footer">
    <p>Eventify &copy; 2026 &mdash; Panel Administrativo</p>
</footer>
</html>
