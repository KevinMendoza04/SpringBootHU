<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Evento')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="card" style="max-width: 560px;">
        <h2>Registrar nuevo evento</h2>

        <form th:action="@{/admin/eventos}" th:object="${evento}" method="post">

            <div class="form-group">
                <label for="nombre">Nombre del evento *</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Concierto de Jazz" required/>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha *</label>
                <input type="date" id="fecha" th:field="*{fecha}" required/>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción *</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                          placeholder="Breve descripción del evento" required></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
