<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Evento')}">
    <style>
        .form-group.has-error input,
        .form-group.has-error textarea,
        .form-group.has-error select {
            border-color: #dc3545;
            background-color: #f8f5f5;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: block;
        }
        .field-error-icon {
            display: inline-block;
            margin-left: 0.5rem;
            color: #dc3545;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main>
    <div class="card" style="max-width: 600px;">
        <h2>Registrar nuevo evento</h2>

        <!-- Success Message Flash -->
        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <!-- Error Message Flash -->
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/eventos}" th:object="${eventoDTO}" method="post" novalidate>

            <!-- Nombre Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('nombre') ? 'has-error' : ''}">
                <label for="nombre">
                    Nombre del evento *
                    <span th:if="${#fields.hasErrors('nombre')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Concierto de Jazz"/>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-message"></span>
            </div>

            <!-- Fecha Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('fecha') ? 'has-error' : ''}">
                <label for="fecha">
                    Fecha *
                    <span th:if="${#fields.hasErrors('fecha')}" class="field-error-icon">⚠</span>
                </label>
                <input type="date" id="fecha" th:field="*{fecha}"/>
                <span th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}" class="error-message"></span>
            </div>

            <!-- Descripcion Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('descripcion') ? 'has-error' : ''}">
                <label for="descripcion">
                    Descripción *
                    <span th:if="${#fields.hasErrors('descripcion')}" class="field-error-icon">⚠</span>
                </label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                          placeholder="Breve descripción del evento"></textarea>
                <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" class="error-message"></span>
            </div>

            <!-- VenueId Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('venueId') ? 'has-error' : ''}">
                <label for="venueId">
                    Lugar (Venue) *
                    <span th:if="${#fields.hasErrors('venueId')}" class="field-error-icon">⚠</span>
                </label>
                <select id="venueId" th:field="*{venueId}" style="width: 100%; padding: 0.5rem 0.7rem; border: 1px solid #c5cae9; border-radius: 5px; font-size: 0.92rem;">
                    <option value="">-- Seleccionar un lugar --</option>
                    <option th:each="lugar : ${lugares}" 
                            th:value="${lugar.id}"
                            th:text="${lugar.nombre} + ' (' + ${lugar.ciudad} + ')' + ' - Cap: ' + ${lugar.capacidad}">
                        Lugar - Cap: 0
                    </option>
                </select>
                <span th:if="${#fields.hasErrors('venueId')}" th:errors="*{venueId}" class="error-message"></span>
            </div>

            <!-- CategoryIds Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('categoryIds') ? 'has-error' : ''}">
                <label>
                    Categorías
                    <span th:if="${#fields.hasErrors('categoryIds')}" class="field-error-icon">⚠</span>
                </label>
                <div style="border: 1px solid #c5cae9; border-radius: 5px; padding: 0.8rem; background: #f9fafb;">
                    <div th:if="${#lists.isEmpty(categorias)}" style="color: #888; font-style: italic;">
                        No hay categorías disponibles. Crea una nueva.
                    </div>
                    <div th:each="categoria : ${categorias}" style="margin-bottom: 0.6rem; display: flex; align-items: center;">
                        <input type="checkbox" 
                               th:id="${'cat_' + categoria.id}" 
                               name="categoryIds"
                               th:value="${categoria.id}"
                               th:checked="${eventoDTO.categoryIds != null and #lists.contains(eventoDTO.categoryIds, categoria.id)}"
                               style="margin-right: 0.5rem; cursor: pointer;"/>
                        <label th:for="${'cat_' + categoria.id}" 
                               style="margin: 0; cursor: pointer; font-weight: normal; display: flex; align-items: center; gap: 0.3rem;">
                            <span th:text="${categoria.nombre}">Categoría</span>
                            <span style="font-size: 0.85rem; color: #888;">(<span th:text="${categoria.descripcion}">Descripción</span>)</span>
                        </label>
                    </div>
                </div>
                <span th:if="${#fields.hasErrors('categoryIds')}" th:errors="*{categoryIds}" class="error-message"></span>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar Evento</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
