<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nueva Categoría')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="card" style="max-width: 560px;">
        <h2>Crear nueva categoría</h2>

        <form th:action="@{/admin/categorias}" th:object="${category}" method="post">

            <div class="form-group">
                <label for="nombre">Nombre de la categoría *</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Conciertos" required/>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                          placeholder="Breve descripción de la categoría"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
