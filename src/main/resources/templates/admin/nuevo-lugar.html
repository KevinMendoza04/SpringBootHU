<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Lugar')}">
    <style>
        .form-group.has-error input,
        .form-group.has-error select {
            border-color: #dc3545;
            background-color: #f8f5f5;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: block;
        }
        .field-error-icon {
            display: inline-block;
            margin-left: 0.5rem;
            color: #dc3545;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main>
    <div class="card" style="max-width: 600px;">
        <h2 th:if="${venueDTO.id == null}">Registrar nuevo lugar</h2>
        <h2 th:if="${venueDTO.id != null}">Editar lugar</h2>

        <!-- Success Message Flash -->
        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <!-- Error Message Flash -->
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <form th:if="${venueDTO.id == null}" th:action="@{/admin/lugares}" th:object="${venueDTO}" method="post" novalidate>
            <!-- Create Form -->

            <!-- Nombre Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('nombre') ? 'has-error' : ''}">
                <label for="nombre">
                    Nombre del lugar *
                    <span th:if="${#fields.hasErrors('nombre')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Auditorio Nacional"/>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-message"></span>
            </div>

            <!-- Direccion Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('direccion') ? 'has-error' : ''}">
                <label for="direccion">
                    Dirección *
                    <span th:if="${#fields.hasErrors('direccion')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ej. Calle Principal 123"/>
                <span th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="error-message"></span>
            </div>

            <!-- Capacidad Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('capacidad') ? 'has-error' : ''}">
                <label for="capacidad">
                    Capacidad *
                    <span th:if="${#fields.hasErrors('capacidad')}" class="field-error-icon">⚠</span>
                </label>
                <input type="number" id="capacidad" th:field="*{capacidad}" placeholder="Ej. 5000" min="1"/>
                <span th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}" class="error-message"></span>
            </div>

            <!-- Ciudad Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('ciudad') ? 'has-error' : ''}">
                <label for="ciudad">
                    Ciudad *
                    <span th:if="${#fields.hasErrors('ciudad')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="ciudad" th:field="*{ciudad}" placeholder="Ej. Bogotá"/>
                <span th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}" class="error-message"></span>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar Lugar</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>

        <form th:if="${venueDTO.id != null}" th:action="@{/admin/lugares/{id}(id=${venueDTO.id})}" th:object="${venueDTO}" method="post" novalidate>
            <!-- Edit Form - Need to use method override for PUT -->
            <input type="hidden" name="_method" value="PUT">

            <!-- Nombre Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('nombre') ? 'has-error' : ''}">
                <label for="nombre">
                    Nombre del lugar *
                    <span th:if="${#fields.hasErrors('nombre')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="nombre" th:field="*{nombre}"/>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-message"></span>
            </div>

            <!-- Direccion Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('direccion') ? 'has-error' : ''}">
                <label for="direccion">
                    Dirección *
                    <span th:if="${#fields.hasErrors('direccion')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="direccion" th:field="*{direccion}"/>
                <span th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="error-message"></span>
            </div>

            <!-- Capacidad Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('capacidad') ? 'has-error' : ''}">
                <label for="capacidad">
                    Capacidad *
                    <span th:if="${#fields.hasErrors('capacidad')}" class="field-error-icon">⚠</span>
                </label>
                <input type="number" id="capacidad" th:field="*{capacidad}" min="1"/>
                <span th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}" class="error-message"></span>
            </div>

            <!-- Ciudad Field -->
            <div class="form-group" th:classappend="${#fields.hasErrors('ciudad') ? 'has-error' : ''}">
                <label for="ciudad">
                    Ciudad *
                    <span th:if="${#fields.hasErrors('ciudad')}" class="field-error-icon">⚠</span>
                </label>
                <input type="text" id="ciudad" th:field="*{ciudad}"/>
                <span th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}" class="error-message"></span>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Actualizar Lugar</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
