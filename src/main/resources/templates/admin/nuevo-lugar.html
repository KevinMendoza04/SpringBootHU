<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Lugar')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main>
    <div class="card" style="max-width: 560px;">
        <h2>Registrar nuevo lugar</h2>

        <form th:action="@{/admin/lugares}" th:object="${venue}" method="post">

            <div class="form-group">
                <label for="nombre">Nombre del lugar *</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Teatro Nacional" required/>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ej. Calle 10 #25-30"/>
            </div>

            <div class="form-group">
                <label for="capacidad">Capacidad *</label>
                <input type="number" id="capacidad" th:field="*{capacidad}" placeholder="Ej. 500" min="1" required/>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/admin/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
